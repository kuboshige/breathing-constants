<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06070A">
<title>Breathing Constants ── 二度と戻らない待受</title>
<style>
  :root{
    --void:#06070A;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);overflow:hidden;overscroll-behavior:none}
  body{
    color:#fff;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #stage{position:fixed;inset:0;background:var(--void)}
  #cv{display:block;width:100%;height:100%;touch-action:manipulation}
  /* 中心に光を残し縁を沈める＝浮遊感 */
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 46%,transparent 42%,rgba(0,0,0,.34) 78%,rgba(0,0,0,.62) 100%)}

  .hud{position:fixed;left:0;right:0;text-align:center;pointer-events:none;
    font-family:var(--mono);color:#fff;text-shadow:0 1px 18px rgba(0,0,0,.6)}
  #clock{top:calc(env(safe-area-inset-top,0px) + 5.5vh);
    font-size:clamp(38px,13vw,72px);font-weight:200;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;line-height:1;opacity:.82}
  #date{top:calc(env(safe-area-inset-top,0px) + 5.5vh + clamp(46px,15vw,86px));
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;opacity:.4}

  #seed{bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    font-size:10px;letter-spacing:.22em;opacity:.32;transition:opacity .6s}

  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 42px);
    font-size:11.5px;letter-spacing:.16em;opacity:0;transition:opacity 1.1s}
  #hint.show{opacity:.6}

  @media (prefers-reduced-motion: reduce){
    #hint{transition:none}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="vignette"></div>

<div class="hud" id="clock">--:--</div>
<div class="hud" id="date"></div>
<div class="hud" id="hint">タップで、別の世界へ</div>
<div class="hud" id="seed"></div>

<script>
(() => {
  // ── 元の式（つぶやきProcessing 係数実験台）と同じ構造 ──
  // 直書き定数を「中心値」として、そこから連続的にゆっくり漂わせる。
  // 二度と同じ配置に戻らない＝待受。
  function compute(i, t, p, out){
    const y = i / p.R;
    const k = (p.A + Math.cos(i / p.B - t * p.C)) * Math.cos(i / p.D);
    const e = y / p.E - p.F;
    const d = Math.hypot(k, e) + Math.sin(e / p.G + t / p.H) - p.I;
    const q = p.J * Math.sin(k * p.K) - y / p.L * k * (p.M + k * Math.sin(Math.cos(e) * p.N - d * p.O + t));
    const c = d - t;
    out[0] = q + p.P * Math.cos(c);
    out[1] = q * Math.sin(c) + p.Q * d;
  }

  // id, 中心値, 下限, 上限, ゆらぎ幅（範囲に対する割合）
  const SPEC = [
    ['A',4,0,10,.16],  ['B',9,1,40,.10],   ['C',2,-4,4,.18],
    ['D',35,5,120,.07],['E',7,1,30,.12],   ['F',13,-30,30,.10],
    ['G',9,1,40,.12],  ['H',2,-4,4,.16],   ['I',4,-10,10,.14],
    ['J',2,-10,10,.16],['K',3,0,10,.12],   ['L',35,5,120,.08],
    ['M',9,0,20,.12],  ['N',9,0,20,.12],   ['O',2,-6,6,.16],
    ['P',40,0,150,.10],['Q',35,5,80,.07],  ['R',235,50,600,.06]
  ];
  const CNT_BASE = 11000;

  // ── 乱数（開くたびに違う軌道になるよう時刻で種を作る） ──
  function mulberry32(a){ return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };}
  let seed = (Date.now() ^ (Math.random()*1e9)) >>> 0;

  // 各定数に、互いに無理数比の3本の波と位相を割り当てる。
  // 無理数比＝準周期＝実質的に二度と同じ並びが戻らない。
  const GR = 1.6180339887;
  let field, phase, hueField, huePhase;
  function seedField(sd){
    const rnd = mulberry32(sd);
    field = SPEC.map((s, n) => {
      const m0 = 0.62 + rnd()*0.5;
      return {
        id:s[0], c:s[1], lo:s[2], hi:s[3], amp:(s[3]-s[2])*s[4],
        f:[m0, m0*GR*(0.7+rnd()*0.4), m0*GR*GR*(0.55+rnd()*0.4)],
        p:[rnd()*6.283, rnd()*6.283, rnd()*6.283]
      };
    });
    hueField = { f:[0.5+rnd()*0.3, (0.5+rnd()*0.3)*GR], p:[rnd()*6.283, rnd()*6.283] };
    huePhase = rnd()*100;
    phase = rnd()*100;        // 最初のフレームから固有の配置に
    document.getElementById('seed').textContent = 'SEED ' + sd.toString(36).toUpperCase().padStart(7,'0');
  }
  seedField(seed);

  // 準周期ノイズ（[-1,1] 付近に収まる滑らかな揺れ）
  function wobble(ph, f, p){
    return (Math.sin(ph*f[0]+p[0]) + 0.55*Math.sin(ph*f[1]+p[1])
          + (f[2]!==undefined ? 0.30*Math.sin(ph*f[2]+p[2]) : 0)) / 1.85;
  }

  const P = { CNT:CNT_BASE };
  function driftParams(){
    for (const g of field){
      const v = g.c + g.amp * wobble(phase, g.f, g.p);
      P[g.id] = Math.min(g.hi, Math.max(g.lo, v));
    }
  }

  // ── 描画 ──────────────────────────────────────────────
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, dot = 1.2;
  let buf = new Float32Array(CNT_BASE*2);
  let view = { s:0, ox:0, oy:0 }, warmed = false;

  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dot = Math.max(1, Math.round(Math.min(W,H)/460 * 10) / 10);
    // 起動直後に一度沈める
    ctx.fillStyle = '#06070A'; ctx.fillRect(0,0,W,H);
    warmed = false;
  }
  addEventListener('resize', resize);

  function fill(tt){
    const n = Math.round(P.CNT), o = [0,0];
    if (buf.length < n*2) buf = new Float32Array(n*2);
    let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    for (let i = n-1, j = 0; i >= 0; i--, j += 2){
      compute(i, tt, P, o);
      const x = o[0], y = o[1];
      if (!isFinite(x) || !isFinite(y) || Math.abs(x) > 1e6 || Math.abs(y) > 1e6){ buf[j]=NaN; continue; }
      buf[j]=x; buf[j+1]=y;
      if (x<minx)minx=x; if (x>maxx)maxx=x; if (y<miny)miny=y; if (y>maxy)maxy=y;
    }
    return { n, minx, maxx, miny, maxy };
  }

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = seed % 100, tStep = reduce ? 0 : Math.PI/100;
  let driftV = reduce ? 0.006 : 0.045, gust = 0, last = performance.now();

  function frame(now){
    const dt = Math.min((now - last)/1000, 0.05); last = now;

    if (!document.hidden){
      phase += (driftV + gust) * dt * 60;
      huePhase += (0.11 + gust*0.4) * dt;
      gust *= Math.exp(-dt/0.85);
      t += tStep * (1 + gust*3);
      if (t > 4000) t -= 4000;

      driftParams();
      const b = fill(t);

      // フィット（縦長画面に合わせて中央へ、少し上寄せ）
      if (b.maxx > b.minx){
        const spanx = Math.max(b.maxx-b.minx, 1e-6), spany = Math.max(b.maxy-b.miny, 1e-6);
        const target = Math.min(W*0.86/spanx, H*0.66/spany);
        const kk = warmed ? 0.06 : 1;
        view.s  += (target - view.s) * kk;
        view.ox += ((b.minx+b.maxx)/2 - view.ox) * kk;
        view.oy += ((b.miny+b.maxy)/2 - view.oy) * kk;
        warmed = true;
      }
      const s = view.s, ox = view.ox, oy = view.oy;
      const cx = W/2, cy = H*0.55;

      // 薄い残像を残して消す＝ゆらぎに尾を引かせる
      ctx.fillStyle = 'rgba(6,7,10,0.30)';
      ctx.fillRect(0,0,W,H);

      const hue = 222 + 72*wobble(huePhase, hueField.f, hueField.p);
      ctx.fillStyle = 'hsla(' + hue.toFixed(0) + ',32%,88%,0.5)';
      const n = Math.round(P.CNT), d = dot;
      for (let j = 0; j < n*2; j += 2){
        const x = buf[j]; if (x !== x) continue;
        ctx.fillRect((x-ox)*s+cx, (buf[j+1]-oy)*s+cy, d, d);
      }
    }
    requestAnimationFrame(frame);
  }

  // ── 時計 ──────────────────────────────────────────────
  const elC = document.getElementById('clock'), elD = document.getElementById('date');
  const DOW = ['日','月','火','水','木','金','土'];
  function tick(){
    const n = new Date(), h = n.getHours(), m = n.getMinutes();
    elC.textContent = (h<10?'0':'')+h + ':' + (m<10?'0':'')+m;
    elD.textContent = n.getFullYear() + '.' + String(n.getMonth()+1).padStart(2,'0')
      + '.' + String(n.getDate()).padStart(2,'0') + ' ' + DOW[n.getDay()];
  }
  tick(); setInterval(tick, 15000);

  // ── タップで一気に流す（滑らかに別の配置へ。無理数比なので二度と戻らない） ──
  const hint = document.getElementById('hint');
  cv.addEventListener('pointerdown', () => { gust = 7; });

  // 起動時のヒント（数秒で消える）
  setTimeout(() => hint.classList.add('show'), 900);
  setTimeout(() => hint.classList.remove('show'), 5200);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
